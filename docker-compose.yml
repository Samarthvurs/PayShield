services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: payshield
      POSTGRES_PASSWORD: payshield
      POSTGRES_DB: payshield
    ports:
      - "5433:5432" # host 5433, so it doesn't clash with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payshield -d payshield"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app # live code, data/ and models/ shared with the host
      - ~/.kaggle:/root/.kaggle:ro # Kaggle API token for `make data`
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
  mongodata:

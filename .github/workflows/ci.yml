name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: payshield
          POSTGRES_PASSWORD: payshield
          POSTGRES_DB: payshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payshield" --health-interval 5s
          --health-timeout 3s --health-retries 20
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://payshield:payshield@localhost:5432/payshield
      MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
